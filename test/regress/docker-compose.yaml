services:
  minio:
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command: "mini -s3.port=9000"
    expose:
      - "9000"
    environment:
      AWS_ACCESS_KEY_ID: some_key
      AWS_SECRET_ACCESS_KEY: some_key
      S3_BUCKET: gpyezzey,gpyezzey2
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status && wget -S --spider http://127.0.0.1:9000 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    hostname: minio

  pg:
    image: postgres
    hostname: pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - "5432"
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s  
      timeout: 5s
      retries: 10
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d
  
  yproxy:
    image: yproxy
    build:
      context: ../..
      dockerfile: test/regress/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      pg:
        condition: service_healthy
