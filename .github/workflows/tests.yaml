name: Run yezzey integration tests

on:
  pull_request:
    branches: "*"
  push:
    branches:
      - "master"
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check out code
        uses: actions/checkout@v7
        with:
          repository: open-gpdb/gpdb
          ref: OPENGPDB_STABLE

      - name: set PR ref
        if: ${{github.event_name == 'pull_request'}}
        run: echo "GITHUB_REF=${{github.head_ref}}" >> $GITHUB_ENV

      - name: set push ref
        if: ${{github.event_name == 'push'}}
        run: echo "GITHUB_REF=${{github.ref_name}}" >> $GITHUB_ENV

      - name: Configure buckets for vacuum test tablespaces
        shell: bash
        run: |
          python3 - <<'PY'
          path = "yezzey_test/yproxy.conf"
          with open(path) as source:
              config = source.read()
          marker = "  tablespace_map:\n"
          assert config.count(marker) == 1, "Expected one tablespace map"
          config = config.replace(marker, marker +
              '    "vacuum_garbage_tab1": "gpyezzey2"\n' +
              '    "vacuum_garbage_tab2": "gpyezzey3"\n')
          with open(path, "w") as output:
              output.write(config)
          PY

      - name: Build
        run: docker compose -f docker/yezzey/docker-compose.yaml build

      - name: Run Docker
        shell: bash
        run: docker compose -f docker/yezzey/docker-compose.yaml run --remove-orphans yezzey

